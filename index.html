<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社北村建設興業</title>
  <meta name="description" content="株式会社北村建設興業は伝統とイマを繋ぐ、新たな技術革新を起こし続ける会社です。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./img/favicon.ico">  
  <link rel="stylesheet" href="./css/reset.css">
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="container">
    <!-- header -->
    <header class="header">
      <div class="inner">
        <div class="header__logo">
          <h1>
            <a href="#">株式会社北村建設興業</a>
          </h1>
        </div>
        <div class="header__nav pc">
          <nav>
            <ul>
              <li><a href="#about">ABOUT</a></li>
              <li><a href="#service">SERVICE</a></li>
              <li><a href="#works">WORKS</a></li>
              <li><a href="#news">NEWS</a></li>
              <li><a href="#company">COMPANY</a></li>
              <li><a href="#contact">CONTACT</a></li>
            </ul>
          </nav>
        </div>
        <button id="js-hamburger" class="hamburger sp">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="hamburger__menu sp">
          <nav>
            <ul>
              <li><a href="#about">ABOUT</a></li>
              <li><a href="#service">SERVICE</a></li>
              <li><a href="#works">WORKS</a></li>
              <li><a href="#news">NEWS</a></li>
              <li><a href="#company">COMPANY</a></li>
              <li><a href="#contact">CONTACT</a></li>
            </ul>
          </nav>          
        </div>
      </div>
    </header>
    <!-- main -->
    <main class="main">
      <!-- fv -->
      <div class="fv">
        <div class="swiper fv__image">
          <div class="swiper-wrapper">
            <div class="swiper-slide fv__slide">
              <picture>
                <source media="(min-width: 768px)" srcset="./img/fv/fv_01.jpg">
                <img src="./img/fv/fv_01_sp.jpg" alt="白い屋根に黒い壁の平屋の一軒家">
              </picture>
            </div>
            <div class="swiper-slide fv__slide">
              <picture>
                <source media="(min-width: 768px)" srcset="./img/fv/fv_02.jpg">
                <img src="./img/fv/fv_02_sp.jpg" alt="茅葺き屋根の古民家3軒とその背景にある緑の山と青空">
              </picture>
            </div>
            <div class="swiper-slide fv__slide">
              <picture>
                <source media="(min-width: 768px)" srcset="./img/fv/fv_03.jpg">
                <img src="./img/fv/fv_03_sp.jpg" alt="白い屋根に黒い壁の平屋の一軒家">
              </picture>
            </div>
          </div>
        </div>
        <div class="fv__contents">
          <div class="fv__catch">
            <h2>永遠も。<br class="sp">瞬間も。<br>あなたと共に。</h2>
          </div>
        </div>
      </div>
    </main>
    <footer>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
